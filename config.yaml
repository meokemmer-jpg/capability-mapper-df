name: capability-mapper-df
capability: capability-mapper
version: 0.1.0
description: "Auto-spawned DF for capability gap: __pycache__ lacks discoverable capability metadata"
inputs:
  source_dir: "~/Projects/dark-factories"
  log_path: "./spawned-dfs-log.jsonl"
outputs:
  - "./artifacts"
policy:
  mode: assistive
  github_repo_creation: true
  requires_gh_auth: true
gap:
  reason: "__pycache__ lacks discoverable capability metadata"
  evidence: "missing: /Users/make/Projects/dark-factories/__pycache__/capabilities.yaml, /Users/make/Projects/dark-factories/__pycache__/capabilities.yml, /Users/make/Projects/dark-factories/__pycache__/capabilities.json, /Users/make/Projects/dark-factories/__pycache__/README.md"
